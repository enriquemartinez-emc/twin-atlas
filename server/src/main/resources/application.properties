spring.application.name=twin-atlas-server

# Local development defaults match docker-compose.yml. Override with environment variables elsewhere.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/twinatlas}
spring.datasource.username=${DATABASE_USER:twinatlas}
spring.datasource.password=${DATABASE_PASSWORD:twinatlas}

# Flyway owns the schema (including GiST indexes). Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
